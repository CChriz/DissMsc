permissions:
  enabled: false
  schema: tiered_policy
  permission_mode: normal
  defaults:
    '*': allow
  tools:
    bash: ask
    mcp_exec_command: ask
    create_terminal: ask
    write: ask
    write_file: ask
    edit_file: ask
    search_replace: ask
    write_memory: allow
    edit_memory: allow
    read_memory: allow
    memory_search: allow
    memory_get: allow
    todo_create: allow
    todo_insert: allow
    todo_complete: allow
    todo_remove: allow
    todo_list: allow
    coding_memory_write: allow
    coding_memory_edit: allow
    coding_memory_read: allow
    ltm_search: allow
    ltm_search_summary: allow
    mem0_profile: allow
    mem0_search: allow
    mem0_conclude: allow
    viking_search: allow
    viking_read: allow
    viking_browse: allow
    viking_remember: allow
    viking_add_resource: allow
    mcp_free_search: allow
    mcp_paid_search: allow
    mcp_fetch_webpage: allow
    cron_list_jobs: allow
    cron_get_job: allow
    cron_create_job: allow
    cron_update_job: allow
    cron_delete_job: allow
    cron_toggle_job: allow
    cron_preview_job: allow
  rules:
  - id: shell_allow_dir
    tools:
    - bash
    - mcp_exec_command
    - create_terminal
    pattern: dir *
    severity: LOW
  - id: shell_allow_ls
    tools:
    - bash
    - mcp_exec_command
    - create_terminal
    pattern: ls *
    severity: LOW
  - id: shell_allow_pwd
    tools:
    - bash
    - mcp_exec_command
    - create_terminal
    pattern: pwd *
    severity: LOW
  - id: shell_allow_cd
    tools:
    - bash
    - mcp_exec_command
    - create_terminal
    pattern: cd *
    severity: LOW
  - id: shell_allow_echo
    tools:
    - bash
    - mcp_exec_command
    - create_terminal
    pattern: echo *
    severity: LOW
  - id: shell_allow_cat
    tools:
    - bash
    - mcp_exec_command
    - create_terminal
    pattern: cat *
    severity: LOW
  - id: shell_allow_type
    tools:
    - bash
    - mcp_exec_command
    - create_terminal
    pattern: type *
    severity: LOW
  - id: shell_allow_head
    tools:
    - bash
    - mcp_exec_command
    - create_terminal
    pattern: head *
    severity: LOW
  - id: shell_allow_tail
    tools:
    - bash
    - mcp_exec_command
    - create_terminal
    pattern: tail *
    severity: LOW
  - id: shell_allow_git_status
    tools:
    - bash
    - mcp_exec_command
    - create_terminal
    pattern: git status *
    severity: LOW
  - id: shell_allow_git_log
    tools:
    - bash
    - mcp_exec_command
    - create_terminal
    pattern: git log *
    severity: LOW
  - id: shell_allow_git_diff
    tools:
    - bash
    - mcp_exec_command
    - create_terminal
    pattern: git diff *
    severity: LOW
  - id: shell_allow_git_branch
    tools:
    - bash
    - mcp_exec_command
    - create_terminal
    pattern: git branch *
    severity: LOW
  - id: shell_ask_rm
    tools:
    - bash
    - mcp_exec_command
    - create_terminal
    pattern: rm *
    severity: HIGH
  - id: shell_ask_del
    tools:
    - bash
    - mcp_exec_command
    - create_terminal
    pattern: del *
    severity: HIGH
  - id: shell_ask_rd
    tools:
    - bash
    - mcp_exec_command
    - create_terminal
    pattern: rd *
    severity: HIGH
  - id: shell_ask_mv
    tools:
    - bash
    - mcp_exec_command
    - create_terminal
    pattern: mv *
    severity: HIGH
  - id: shell_ask_cp
    tools:
    - bash
    - mcp_exec_command
    - create_terminal
    pattern: cp *
    severity: HIGH
  - id: shell_ask_chmod
    tools:
    - bash
    - mcp_exec_command
    - create_terminal
    pattern: chmod *
    severity: HIGH
  - id: shell_ask_chown
    tools:
    - bash
    - mcp_exec_command
    - create_terminal
    pattern: chown *
    severity: HIGH
  - id: shell_ask_sensitive_file_reads
    tools:
    - bash
    - mcp_exec_command
    - create_terminal
    pattern: re:(?i)(^|[\s;&|()])((cat|type|less|more|head|tail|grep|find|Get-Content|Select-String)\b[^;&|]*(id_rsa|id_ed25519|\.pem\b|\.pfx\b|\.key\b|\.kube/config|\.aws/(credentials|config)|\.npmrc\b|\.env(\.[A-Za-z0-9_-]+)?\b|authorized_keys|\.ssh/))
    severity: HIGH
  - id: path_ask_ssh
    tools:
    - read_file
    - write_file
    - edit_file
    - read_text_file
    - write_text_file
    - write
    - read
    - glob_file_search
    - glob
    - list_dir
    - list_files
    - grep
    - search_replace
    pattern: '**/.ssh/**'
    severity: HIGH
  - id: path_ask_env
    tools:
    - read_file
    - write_file
    - edit_file
    - read_text_file
    - write_text_file
    - write
    - read
    - glob_file_search
    - glob
    - list_dir
    - list_files
    - grep
    - search_replace
    pattern: '**/.env*'
    severity: HIGH
  owner_scopes: {}
  deny_guidance_message: ''
  external_directory:
